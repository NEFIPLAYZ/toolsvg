<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Dev Toolkit">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3aa63a"/>
      <stop offset="1" stop-color="#1f6d1f"/>
    </linearGradient>
  </defs>

  <!-- rounded tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#g)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>

  <!-- four tool cells -->
  <g fill="#ffffff" fill-opacity="0.95">
    <rect x="15" y="15" width="14" height="14" rx="3"/>
    <rect x="35" y="15" width="14" height="14" rx="3" fill-opacity="0.6"/>
    <rect x="15" y="35" width="14" height="14" rx="3" fill-opacity="0.6"/>
    <rect x="35" y="35" width="14" height="14" rx="3"/>
  </g>
</svg>
